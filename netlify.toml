[build]
  publish = "dist"
  command = "npm run build"

# Decap CMS Admin Routing
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200

# Client-side Single Page Application (SPA) catch-all rewrite rule
# Rewrites all requests to /index.html with HTTP 200 so React Router handles them
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Custom HTTP Headers
# 1. HTML Entry Points: Never cache aggressively; always revalidate with server
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 2. Decap CMS Admin Panel
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 3. Immutable caching for content-hashed production assets (Vite output in /assets/)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 4. Uploaded media assets
[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
